<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>D4rk LiveMap – Login</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Syne:wght@600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg:      #07080f;
      --s1:      #0d0f1a;
      --s2:      #12162a;
      --s3:      #181d31;
      --border:  #1e2540;
      --border2: #252d45;
      --text:    #c8d0e8;
      --muted:   #4a5275;
      --teal:    #00d4aa;
      --teal2:   #00a884;
      --red:     #f43f5e;
      --amber:   #f59e0b;
      --blue:    #3b82f6;
      --discord: #5865F2;
      --discord2:#4752c4;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      width: 100%; height: 100%;
      background: var(--bg);
      font-family: 'Syne', sans-serif;
      color: var(--text);
      overflow: hidden;
    }

    /* ── Hintergrund-Grid ── */
    body::before {
      content: '';
      position: fixed; inset: 0;
      background-image:
        linear-gradient(var(--border) 1px, transparent 1px),
        linear-gradient(90deg, var(--border) 1px, transparent 1px);
      background-size: 40px 40px;
      opacity: .35;
      pointer-events: none;
    }

    /* Glow-Effekt oben */
    body::after {
      content: '';
      position: fixed;
      top: -200px; left: 50%; transform: translateX(-50%);
      width: 600px; height: 400px;
      background: radial-gradient(ellipse, rgba(0,212,170,.07) 0%, transparent 70%);
      pointer-events: none;
    }

    /* ── Hauptcontainer ── */
    .page {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      gap: 0;
      z-index: 1;
    }

    /* ── Karte ── */
    .card {
      width: 100%;
      max-width: 420px;
      background: var(--s1);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 40px 36px 36px;
      box-shadow: 0 32px 80px rgba(0,0,0,.6), 0 0 0 1px rgba(255,255,255,.03);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 28px;
    }

    /* ── Logo-Bereich ── */
    .logo-area {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      text-align: center;
    }

    .logo-icon {
      width: 56px; height: 56px;
      border-radius: 16px;
      background: linear-gradient(135deg, var(--teal), #0ea5e9);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 26px;
      box-shadow: 0 0 30px rgba(0,212,170,.25);
    }

    .logo-title {
      font-size: 1.5rem;
      font-weight: 800;
      letter-spacing: -.03em;
      color: #fff;
      line-height: 1;
    }

    .logo-sub {
      font-size: .78rem;
      color: var(--muted);
      font-family: 'JetBrains Mono', monospace;
      margin-top: 2px;
    }

    /* ── Trennlinie ── */
    .divider {
      width: 100%;
      height: 1px;
      background: var(--border);
    }

    /* ── Info-Box ── */
    .info-box {
      width: 100%;
      background: var(--s2);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 14px 16px;
      display: flex;
      align-items: flex-start;
      gap: 11px;
    }

    .info-icon {
      font-size: 16px;
      flex-shrink: 0;
      margin-top: 1px;
    }

    .info-text {
      font-size: .78rem;
      color: var(--muted);
      line-height: 1.5;
    }

    .info-text strong {
      color: var(--text);
      font-weight: 700;
    }

    /* ── Error-Box ── */
    .error-box {
      width: 100%;
      background: rgba(244, 63, 94, .08);
      border: 1px solid rgba(244, 63, 94, .3);
      border-radius: 12px;
      padding: 14px 16px;
      display: flex;
      align-items: flex-start;
      gap: 11px;
      animation: slideIn .3s ease;
    }

    .error-box .info-icon { font-size: 16px; }

    .error-text {
      font-size: .78rem;
      color: #fca5b0;
      line-height: 1.5;
    }

    .error-text strong {
      color: var(--red);
      font-weight: 700;
      display: block;
      margin-bottom: 3px;
    }

    @keyframes slideIn {
      from { opacity: 0; transform: translateY(-8px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* ── Discord Button ── */
    .btn-discord {
      width: 100%;
      padding: 14px 20px;
      background: var(--discord);
      border: none;
      border-radius: 12px;
      color: #fff;
      font-family: 'Syne', sans-serif;
      font-size: .92rem;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      text-decoration: none;
      transition: all .18s;
      box-shadow: 0 4px 20px rgba(88,101,242,.35);
      letter-spacing: -.01em;
    }

    .btn-discord:hover {
      background: var(--discord2);
      box-shadow: 0 6px 28px rgba(88,101,242,.5);
      transform: translateY(-1px);
    }

    .btn-discord:active {
      transform: translateY(0);
      box-shadow: 0 2px 12px rgba(88,101,242,.3);
    }

    .btn-discord svg {
      width: 22px; height: 22px;
      flex-shrink: 0;
    }

    /* ── Footer ── */
    .footer {
      font-size: .65rem;
      color: var(--muted);
      text-align: center;
      font-family: 'JetBrains Mono', monospace;
      line-height: 1.6;
    }

    .footer a {
      color: var(--teal);
      text-decoration: none;
    }

    /* ── Animated Dots (Ladeindikator) ── */
    .dots::after {
      content: '';
      animation: dots 1.2s steps(3, end) infinite;
    }
    @keyframes dots {
      0%   { content: ''; }
      33%  { content: '.'; }
      66%  { content: '..'; }
      100% { content: '...'; }
    }
  </style>
</head>
<body>
  <div class="page">
    <div class="card" id="card">

      <!-- Logo -->
      <div class="logo-area">
        <div class="logo-icon">🗺️</div>
        <div>
          <div class="logo-title">D4rk LiveMap</div>
          <div class="logo-sub" id="serverName">Echtzeit Spielertracking</div>
        </div>
      </div>

      <div class="divider"></div>

      <!-- Fehler-Box (wird per JS befüllt) -->
      <div class="error-box" id="errorBox" style="display:none">
        <span class="info-icon">⚠️</span>
        <div class="error-text">
          <strong id="errorTitle">Zugriff verweigert</strong>
          <span id="errorMsg">Du hast keine Berechtigung die Karte zu sehen.</span>
        </div>
      </div>

      <!-- Info-Box -->
      <div class="info-box">
        <span class="info-icon">🔐</span>
        <div class="info-text">
          Diese Karte ist <strong>geschützt</strong>. Melde dich mit deinem Discord-Account an,
          um Zugang zu erhalten.
        </div>
      </div>

      <!-- Discord Login Button -->
      <a class="btn-discord" href="/d4rk_livemap/auth/login" id="loginBtn">
        <!-- Discord Logo SVG -->
        <svg viewBox="0 0 24 24" fill="currentColor" xmlns="http://www.w3.org/2000/svg">
          <path d="M20.317 4.37a19.791 19.791 0 0 0-4.885-1.515.074.074 0 0 0-.079.037c-.21.375-.444.864-.608 1.25a18.27 18.27 0 0 0-5.487 0 12.64 12.64 0 0 0-.617-1.25.077.077 0 0 0-.079-.037A19.736 19.736 0 0 0 3.677 4.37a.07.07 0 0 0-.032.027C.533 9.046-.32 13.58.099 18.057a.082.082 0 0 0 .031.057 19.9 19.9 0 0 0 5.993 3.03.078.078 0 0 0 .084-.028c.462-.63.874-1.295 1.226-1.994a.076.076 0 0 0-.041-.106 13.107 13.107 0 0 1-1.872-.892.077.077 0 0 1-.008-.128 10.2 10.2 0 0 0 .372-.292.074.074 0 0 1 .077-.01c3.928 1.793 8.18 1.793 12.062 0a.074.074 0 0 1 .078.01c.12.098.246.198.373.292a.077.077 0 0 1-.006.127 12.299 12.299 0 0 1-1.873.892.077.077 0 0 0-.041.107c.36.698.772 1.362 1.225 1.993a.076.076 0 0 0 .084.028 19.839 19.839 0 0 0 6.002-3.03.077.077 0 0 0 .032-.054c.5-5.177-.838-9.674-3.549-13.66a.061.061 0 0 0-.031-.03zM8.02 15.33c-1.183 0-2.157-1.085-2.157-2.419 0-1.333.956-2.419 2.157-2.419 1.21 0 2.176 1.096 2.157 2.42 0 1.333-.956 2.418-2.157 2.418zm7.975 0c-1.183 0-2.157-1.085-2.157-2.419 0-1.333.955-2.419 2.157-2.419 1.21 0 2.176 1.096 2.157 2.42 0 1.333-.946 2.418-2.157 2.418z"/>
        </svg>
        Mit Discord anmelden
      </a>

      <!-- Footer -->
      <div class="footer">
        d4rk_livemap v1.0 · by D4rkst3r
      </div>
    </div>
  </div>

  <script>
    // ── URL-Parameter auswerten ──────────────────────────────────
    const params = new URLSearchParams(window.location.search);
    const error  = params.get('error');

    // Fehlertext-Mapping
    const ERROR_MESSAGES = {
      no_code:      ['Ungültiger Login-Link',   'Der Autorisierungs-Code fehlt. Versuche es erneut.'],
      token_error:  ['Discord-Fehler',          'Der Token-Austausch mit Discord ist fehlgeschlagen. Versuche es erneut.'],
      user_error:   ['Nutzerdaten-Fehler',      'Deine Discord-Nutzerdaten konnten nicht abgerufen werden.'],
      not_in_guild: ['Kein Server-Mitglied',    'Du bist nicht Mitglied des benötigten Discord-Servers.'],
      no_role:      ['Keine Berechtigung',       'Du hast nicht die erforderliche Rolle auf dem Discord-Server.'],
      unknown:      ['Unbekannter Fehler',       'Ein unbekannter Fehler ist aufgetreten. Bitte versuche es erneut.'],
    };

    if (error) {
      const [title, msg] = ERROR_MESSAGES[error] || ERROR_MESSAGES.unknown;
      document.getElementById('errorTitle').textContent = title;
      document.getElementById('errorMsg').textContent   = msg;
      document.getElementById('errorBox').style.display = 'flex';
    }

    // Lade-State beim Klick auf den Login-Button
    document.getElementById('loginBtn').addEventListener('click', function(e) {
      this.innerHTML = `<span class="dots">Weiterleitung zu Discord</span>`;
      this.style.pointerEvents = 'none';
      this.style.opacity = '.7';
    });
  </script>
</body>
</html>
