<!DOCTYPE html>
<html lang="de">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>D4rk LiveMap</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link
    href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Syne:wght@600;700;800&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
  <style>
    :root {
      --bg: #07080f;
      --s1: #0d0f1a;
      --s2: #12162a;
      --s3: #181d31;
      --border: #1e2540;
      --border2: #252d45;
      --text: #c8d0e8;
      --muted: #4a5275;
      --teal: #00d4aa;
      --teal2: #00a884;
      --red: #f43f5e;
      --amber: #f59e0b;
      --blue: #3b82f6;
      --purple: #a78bfa;
      --green: #22c55e;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0
    }

    html,
    body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: var(--bg);
      font-family: 'Syne', sans-serif;
      color: var(--text)
    }

    /* ── App Layout ── */
    #app {
      display: flex;
      flex-direction: column;
      height: 100vh
    }

    /* ── Topbar ── */
    #topbar {
      height: 50px;
      flex-shrink: 0;
      background: var(--s1);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 0 16px;
      z-index: 1000;
      position: relative;
    }

    .logo {
      font-weight: 800;
      font-size: .95rem;
      letter-spacing: -.02em;
      color: #fff;
      display: flex;
      align-items: center;
      gap: 8px
    }

    .logo-badge {
      background: linear-gradient(135deg, var(--teal), var(--blue));
      border-radius: 6px;
      width: 26px;
      height: 26px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 13px;
    }

    .sep {
      width: 1px;
      height: 18px;
      background: var(--border);
      flex-shrink: 0
    }

    .pill {
      font-size: .68rem;
      font-weight: 700;
      padding: 3px 9px;
      border-radius: 20px;
      border: 1px solid
    }

    .pill-teal {
      color: var(--teal);
      border-color: var(--teal2);
      background: #00d4aa12
    }

    .pill-red {
      color: var(--red);
      border-color: #7f1d2a;
      background: #f43f5e10
    }

    .pill-gray {
      color: var(--muted);
      border-color: var(--border);
      background: var(--s2)
    }

    #onlineCount {
      font-family: 'JetBrains Mono', monospace;
      font-size: .75rem
    }

    #updateStatus {
      font-family: 'JetBrains Mono', monospace;
      font-size: .65rem;
      color: var(--muted)
    }

    .tb-right {
      margin-left: auto;
      display: flex;
      align-items: center;
      gap: 7px
    }

    .btn {
      background: var(--s2);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 5px 12px;
      border-radius: 7px;
      cursor: pointer;
      font-size: .75rem;
      font-family: 'Syne', sans-serif;
      font-weight: 600;
      transition: all .15s;
      white-space: nowrap;
    }

    .btn:hover {
      background: var(--s3);
      border-color: var(--border2)
    }

    .btn-teal {
      background: #00d4aa12;
      border-color: var(--teal2);
      color: var(--teal)
    }

    .btn-teal:hover {
      background: #00d4aa22
    }

    /* ── Main ── */
    #main {
      display: flex;
      flex: 1;
      overflow: hidden
    }

    /* ── Sidebar ── */
    #sidebar {
      width: 260px;
      flex-shrink: 0;
      background: var(--s1);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      transition: width .25s cubic-bezier(.4, 0, .2, 1);
    }

    #sidebar.hidden {
      width: 0
    }

    .sb-head {
      padding: 10px 13px;
      border-bottom: 1px solid var(--border);
      font-size: .62rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: .1em;
      color: var(--muted);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .sb-head span {
      color: var(--muted);
      font-family: 'JetBrains Mono', monospace
    }

    /* Suche */
    #searchBox {
      padding: 7px 10px;
      border-bottom: 1px solid var(--border)
    }

    #search {
      width: 100%;
      background: var(--s2);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 6px 10px;
      border-radius: 7px;
      font-size: .78rem;
      outline: none;
      font-family: 'Syne', sans-serif;
    }

    #search:focus {
      border-color: var(--teal2)
    }

    #search::placeholder {
      color: var(--muted)
    }

    /* Tabs */
    .tabs {
      display: flex;
      border-bottom: 1px solid var(--border)
    }

    .tab {
      flex: 1;
      padding: 8px;
      text-align: center;
      cursor: pointer;
      font-size: .72rem;
      font-weight: 700;
      color: var(--muted);
      border-bottom: 2px solid transparent;
      transition: all .15s;
    }

    .tab.active {
      color: var(--teal);
      border-color: var(--teal)
    }

    .tab:hover:not(.active) {
      color: var(--text)
    }

    /* Listen */
    #tabContent {
      overflow-y: auto;
      flex: 1
    }

    .list-empty {
      padding: 24px;
      text-align: center;
      color: var(--muted);
      font-size: .78rem
    }

    /* Spieler-Item */
    .p-item {
      display: flex;
      align-items: center;
      gap: 9px;
      padding: 8px 13px;
      border-bottom: 1px solid #0a0c16;
      cursor: pointer;
      transition: background .1s;
    }

    .p-item:hover {
      background: var(--s2)
    }

    .p-avatar {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 11px;
      font-weight: 700;
      border: 2px solid;
    }

    .p-info {
      flex: 1;
      overflow: hidden
    }

    .p-name {
      font-size: .8rem;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis
    }

    .p-detail {
      font-size: .65rem;
      color: var(--muted);
      font-family: 'JetBrains Mono', monospace;
      margin-top: 1px
    }

    .p-id {
      font-family: 'JetBrains Mono', monospace;
      font-size: .62rem;
      color: var(--muted)
    }

    /* Marker-Item */
    .m-item {
      display: flex;
      align-items: center;
      gap: 9px;
      padding: 7px 13px;
      border-bottom: 1px solid #0a0c16;
      cursor: pointer;
      transition: background .1s;
    }

    .m-item:hover {
      background: var(--s2)
    }

    .m-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      flex-shrink: 0;
      border: 2px solid
    }

    .m-info {
      flex: 1;
      overflow: hidden
    }

    .m-name {
      font-size: .78rem;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis
    }

    .m-meta {
      font-size: .63rem;
      color: var(--muted);
      font-family: 'JetBrains Mono', monospace;
      margin-top: 1px
    }

    .m-del {
      background: none;
      border: none;
      color: var(--muted);
      cursor: pointer;
      font-size: 12px;
      padding: 3px;
      border-radius: 4px;
      flex-shrink: 0
    }

    .m-del:hover {
      color: var(--red);
      background: #f43f5e12
    }

    /* Gruppen-Filter */
    .group-filter {
      display: flex;
      flex-wrap: wrap;
      gap: 4px;
      padding: 8px 10px;
      border-bottom: 1px solid var(--border)
    }

    .gf-btn {
      font-size: .65rem;
      padding: 2px 8px;
      border-radius: 12px;
      cursor: pointer;
      border: 1px solid var(--border);
      background: var(--s2);
      color: var(--muted);
      font-family: 'Syne', sans-serif;
      font-weight: 600;
      transition: all .15s;
    }

    .gf-btn.active {
      border-color: var(--teal);
      color: var(--teal);
      background: #00d4aa12
    }

    /* ── Karte ── */
    #mapWrap {
      flex: 1;
      position: relative;
      overflow: hidden
    }

    #map {
      width: 100%;
      height: 100%;
      background: #07080f
    }

    /* Leaflet Overrides */
    .leaflet-container {
      background: #07080f !important;
      font-family: 'Syne', sans-serif
    }

    .leaflet-control-zoom {
      border: 1px solid var(--border) !important;
      background: var(--s1) !important;
      border-radius: 8px !important;
      overflow: hidden
    }

    .leaflet-control-zoom a {
      background: var(--s1) !important;
      color: var(--text) !important;
      border-bottom: 1px solid var(--border) !important;
      width: 28px !important;
      height: 28px !important;
      line-height: 28px !important
    }

    .leaflet-control-zoom a:hover {
      background: var(--s2) !important
    }

    .leaflet-control-attribution {
      background: rgba(7, 8, 15, .75) !important;
      color: var(--muted) !important;
      font-size: .6rem !important
    }

    /* Popup */
    .leaflet-popup-content-wrapper {
      background: var(--s2) !important;
      border: 1px solid var(--border) !important;
      border-radius: 10px !important;
      box-shadow: 0 12px 32px #000b !important;
      color: var(--text) !important;
      padding: 0 !important;
    }

    .leaflet-popup-content {
      margin: 0 !important;
      min-width: 190px
    }

    .leaflet-popup-tip {
      background: var(--s2) !important
    }

    .leaflet-popup-close-button {
      color: var(--muted) !important;
      top: 8px !important;
      right: 10px !important;
      font-size: 16px !important
    }

    .pop {
      padding: 13px 15px
    }

    .pop-title {
      font-weight: 700;
      font-size: .88rem;
      color: #fff;
      margin-bottom: 8px;
      padding-right: 16px
    }

    .pop-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: .72rem;
      margin-bottom: 4px
    }

    .pop-key {
      color: var(--muted)
    }

    .pop-val {
      font-family: 'JetBrains Mono', monospace;
      color: var(--text)
    }

    .pop-badge {
      font-size: .62rem;
      padding: 2px 7px;
      border-radius: 10px;
      border: 1px solid
    }

    .pop-actions {
      margin-top: 10px;
      display: flex;
      gap: 6px
    }

    .pop-btn {
      flex: 1;
      padding: 5px;
      border-radius: 6px;
      cursor: pointer;
      font-size: .7rem;
      font-family: 'Syne', sans-serif;
      font-weight: 600;
      border: 1px solid;
      transition: all .15s
    }

    .pop-btn-blue {
      background: #0a1428;
      border-color: #0f2048;
      color: #60a5fa
    }

    .pop-btn-blue:hover {
      background: #0d1a38
    }

    .pop-btn-red {
      background: #1a0810;
      border-color: #7f1d2a;
      color: var(--red)
    }

    .pop-btn-red:hover {
      background: #240b14
    }

    /* Koordinaten-Bar ── */
    #coords {
      position: absolute;
      bottom: 10px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(7, 8, 15, .85);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 4px 14px;
      font-family: 'JetBrains Mono', monospace;
      font-size: .7rem;
      color: var(--muted);
      pointer-events: none;
      z-index: 500;
      white-space: nowrap;
    }

    /* Mini-Stats in Topbar */
    .mini-stat {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1px;
      padding: 0 8px;
      border-left: 1px solid var(--border)
    }

    .mini-stat-val {
      font-family: 'JetBrains Mono', monospace;
      font-size: .85rem;
      font-weight: 700;
      color: #fff;
      line-height: 1
    }

    .mini-stat-label {
      font-size: .55rem;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: .08em
    }

    /* Loading ── */
    #loading {
      position: absolute;
      inset: 0;
      background: var(--bg);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 14px;
      z-index: 9999;
    }

    .spin {
      width: 36px;
      height: 36px;
      border: 2px solid var(--border);
      border-top-color: var(--teal);
      border-radius: 50%;
      animation: spin .7s linear infinite
    }

    @keyframes spin {
      to {
        transform: rotate(360deg)
      }
    }

    .loading-text {
      font-size: .82rem;
      color: var(--muted)
    }

    /* Pulse-Dot für Online-Status */
    .pulse {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--teal);
      flex-shrink: 0;
      position: relative
    }

    .pulse::after {
      content: '';
      position: absolute;
      inset: -3px;
      border-radius: 50%;
      background: var(--teal);
      opacity: .3;
      animation: pulse 1.5s ease infinite
    }

    .pulse.dead {
      background: var(--red)
    }

    .pulse.dead::after {
      background: var(--red);
      animation: none;
      opacity: 0
    }

    @keyframes pulse {

      0%,
      100% {
        transform: scale(1);
        opacity: .3
      }

      50% {
        transform: scale(1.8);
        opacity: 0
      }
    }

    @media(max-width:768px) {
      #sidebar {
        display: none
      }
    }
  </style>
</head>

<body>
  <div id="app">
    <div id="topbar">
      <div class="logo">
        <div class="logo-badge">🗺️</div>
        D4rk LiveMap
      </div>
      <div class="sep"></div>
      <span class="pulse dead" id="statusDot"></span>
      <span id="onlineCount" class="pill pill-gray">–</span>

      <div class="mini-stat">
        <span class="mini-stat-val" id="statPlayers">–</span>
        <span class="mini-stat-label">Spieler</span>
      </div>
      <div class="mini-stat">
        <span class="mini-stat-val" id="statMarkers">–</span>
        <span class="mini-stat-label">Marker</span>
      </div>

      <div class="sep"></div>
      <span id="updateStatus">Verbinde...</span>

      <div class="tb-right">
        <button class="btn" onclick="toggleSidebar()">☰ Sidebar</button>
        <button class="btn" onclick="centerMap()">⌖ Zentrieren</button>
        <button class="btn btn-teal" id="followBtn" onclick="toggleFollow()">👁 Follow: AUS</button>
      </div>
    </div>

    <div id="main">
      <div id="sidebar">
        <div class="tabs">
          <div class="tab active" id="tabPlayers" onclick="switchTab('players')">👥 Spieler</div>
          <div class="tab" id="tabMarkers" onclick="switchTab('markers')">📍 Marker</div>
        </div>
        <div id="searchBox">
          <input id="search" placeholder="Suchen..." oninput="renderLists()">
        </div>
        <div id="groupFilter" class="group-filter" style="display:none"></div>
        <div id="tabContent"></div>
      </div>

      <div id="mapWrap">
        <div id="loading">
          <div class="spin"></div>
          <p class="loading-text">Karte lädt...</p>
        </div>
        <div id="map"></div>
        <div id="coords">X: – · Y: –</div>
      </div>
    </div>
  </div>

  <script>
    // ═══════════════════════════════════════════════════════════
    // KONFIGURATION
    // ═══════════════════════════════════════════════════════════

    // GTA5 Weltkoordinaten-Grenzen (für Marker etc.)
    const WORLD = { x0: -4096, x1: 4096, y0: -4096, y1: 4096 };

    // Hilfsfunktion: GTA5-Koordinaten → Leaflet LatLng
    function gta(x, y) { return [y, x]; }

    // URL-Parameter auslesen
    // ?mode=markers  → nur Marker, keine Spieler (für Dashboard-Iframe)
    // ?group=Props   → bestimmte Gruppe vorfiltern
    // ?sidebar=0     → Sidebar verstecken
    const URL_PARAMS = new URLSearchParams(window.location.search);
    const MODE_MARKERS = URL_PARAMS.get('mode') === 'markers';  // nur Marker
    const PRESET_GROUP = URL_PARAMS.get('group') || null;        // Gruppe vorfiltern
    const HIDE_SIDEBAR = URL_PARAMS.get('sidebar') === '0';      // Sidebar aus

    // Update-Intervall für die Karte (ms)
    const POLL_INTERVAL = 2000;

    // Spieler-Farben (rotierend)
    const PLAYER_COLORS = ['#00d4aa', '#60a5fa', '#a78bfa', '#f59e0b', '#22c55e', '#f43f5e', '#06b6d4', '#ec4899'];

    // Marker-Gruppen-Farben
    const GROUP_COLORS = {
      'Allgemein': '#60a5fa', 'Polizei': '#f87171', 'Baustelle': '#fbbf24',
      'Admin': '#c084fc', 'Props': '#00d4aa', 'Sonstiges': '#4ade80',
    };
    const gcolor = g => GROUP_COLORS[g] || GROUP_COLORS['Sonstiges'];

    // Basis-URL (automatisch ermittelt)
    const BASE = window.location.origin;

    // ═══════════════════════════════════════════════════════════
    // LEAFLET MAP SETUP  (nach gta-v-map-leaflet Referenz)
    // ═══════════════════════════════════════════════════════════

    // GTA5 Koordinaten-Kalibrierung
    // center_x / center_y: Offset damit GTA (0,0) auf den richtigen Pixel zeigt
    // scale_x  / scale_y:  Wie viele Pixel pro GTA-Unit (bei Zoom 0)
    const CENTER_X = 117.3;
    const CENTER_Y = 172.8;
    const SCALE_X = 0.02072;
    const SCALE_Y = 0.0205;

    // Custom CRS – exakt wie in der Referenzimplementierung
    const GTA_CRS = L.extend({}, L.CRS.Simple, {
      projection: L.Projection.LonLat,
      scale: function (zoom) { return Math.pow(2, zoom); },
      zoom: function (scale) { return Math.log(scale) / Math.LN2; },
      distance: function (pos1, pos2) {
        const dx = pos2.lng - pos1.lng;
        const dy = pos2.lat - pos1.lat;
        return Math.sqrt(dx * dx + dy * dy);
      },
      transformation: new L.Transformation(SCALE_X, CENTER_X, -SCALE_Y, CENTER_Y),
      infinite: true,
    });

    // GTA5 Karten-Bounds (für fitBounds / maxBounds)
    const GTA_BOUNDS = [[-4096, -4096], [4096, 4096]];

    const map = L.map('map', {
      crs: GTA_CRS,
      minZoom: 0,
      maxZoom: 5,
      zoom: 3,
      center: [0, 0],
      preferCanvas: true,
      zoomControl: false,
      attributionControl: true,
    });

    L.control.zoom({ position: 'bottomright' }).addTo(map);

    // ── Tile Layer ─────────────────────────────────────────────
    // Format: web/tiles/{z}/{x}/{y}.jpg  (X vor Y!)
    const tileLayer = L.tileLayer(BASE + '/d4rk_livemap/tiles/{z}/{x}/{y}.jpg', {
      minZoom: 0,
      maxZoom: 5,
      maxNativeZoom: 5,
      noWrap: true,
      continuousWorld: false,
      attribution: 'GTA5 Map',
      errorTileUrl: 'data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7',
    });
    tileLayer.addTo(map);

    map.setView([0, 0], 3);

    // Loading ausblenden sobald Karte initialisiert
    map.whenReady(() => {
      setTimeout(() => {
        document.getElementById('loading').style.display = 'none';
      }, 600);
    });

    // ═══════════════════════════════════════════════════════════
    // STATE
    // ═══════════════════════════════════════════════════════════

    let allPlayers = [];
    let allMarkers = [];
    let playerLayers = {};   // id → L.marker
    let markerLayers = {};   // id → L.marker
    let activeTab = 'players';
    let activeGroup = null;
    let followPlayer = null;  // id des verfolgten Spielers
    let colorMap = {};    // id → Farbe (persistent)
    let colorIdx = 0;

    function getPlayerColor(id) {
      if (!colorMap[id]) {
        colorMap[id] = PLAYER_COLORS[colorIdx % PLAYER_COLORS.length];
        colorIdx++;
      }
      return colorMap[id];
    }

    // ═══════════════════════════════════════════════════════════
    // MARKER-ICONS
    // ═══════════════════════════════════════════════════════════

    function makePlayerIcon(color, heading, name) {
      const arrow = `
    <div style="position:absolute;top:-8px;left:50%;transform:translateX(-50%) rotate(${heading}deg);font-size:10px;line-height:1">▲</div>
  `;
      return L.divIcon({
        className: '',
        html: `<div style="position:relative;width:32px;height:32px">
      <div style="
        width:32px;height:32px;border-radius:50%;
        background:${color}22;border:2px solid ${color};
        display:flex;align-items:center;justify-content:center;
        font-size:11px;font-weight:700;color:${color};
        box-shadow:0 0 10px ${color}55;
        font-family:'JetBrains Mono',monospace;
      ">👤</div>
      <div style="
        position:absolute;top:100%;left:50%;transform:translateX(-50%);
        margin-top:3px;white-space:nowrap;
        background:rgba(7,8,15,.85);border:1px solid ${color}66;
        border-radius:4px;padding:1px 5px;
        font-size:9px;font-family:'Syne',sans-serif;font-weight:700;color:#fff;
      ">${name}</div>
    </div>`,
        iconSize: [32, 32],
        iconAnchor: [16, 16],
        popupAnchor: [0, -20],
      });
    }

    function makeMarkerIcon(color, icon) {
      const icons = { box: '📦', cone: '🚧', barrier: '🚔', tent: '⛺', lamp: '💡', blip: '⭕', default: '📍' };
      const emoji = icons[icon] || icons.default;
      return L.divIcon({
        className: '',
        html: `<div style="
      width:30px;height:30px;border-radius:50%;
      background:${color}20;border:2px solid ${color};
      display:flex;align-items:center;justify-content:center;
      font-size:13px;cursor:pointer;
      box-shadow:0 0 8px ${color}44;
    ">${emoji}</div>`,
        iconSize: [30, 30],
        iconAnchor: [15, 15],
        popupAnchor: [0, -18],
      });
    }

    // ═══════════════════════════════════════════════════════════
    // SPIELER AUF KARTE
    // ═══════════════════════════════════════════════════════════

    function updatePlayerMarkers(players) {
      const seen = new Set();

      players.forEach(p => {
        seen.add(p.id);
        const col = getPlayerColor(p.id);
        const latlng = [p.y, p.x];

        if (playerLayers[p.id]) {
          // Bestehenden Marker bewegen
          playerLayers[p.id].setLatLng(latlng);
          playerLayers[p.id].setIcon(makePlayerIcon(col, p.heading, p.name));
        } else {
          // Neuen Marker erstellen
          const lm = L.marker(latlng, { icon: makePlayerIcon(col, p.heading, p.name), zIndexOffset: 1000 });
          lm.bindPopup(() => buildPlayerPopup(p.id), { maxWidth: 240 });
          lm.on('click', () => {
            // Popup-Daten aktuell halten
            const cur = allPlayers.find(x => x.id === p.id);
            if (cur) lm.setPopupContent(buildPlayerPopup(cur.id));
          });
          lm.addTo(map);
          playerLayers[p.id] = lm;
        }
      });

      // Spieler die weg sind entfernen
      for (const id in playerLayers) {
        if (!seen.has(+id)) {
          map.removeLayer(playerLayers[id]);
          delete playerLayers[id];
          if (followPlayer === +id) { followPlayer = null; updateFollowBtn(); }
        }
      }
    }

    function buildPlayerPopup(id) {
      const p = allPlayers.find(x => x.id === id);
      if (!p) return '<div class="pop"><p style="color:var(--muted)">Spieler offline</p></div>';
      const col = getPlayerColor(id);
      return `<div class="pop">
    <div class="pop-title">${p.name}</div>
    <div class="pop-row"><span class="pop-key">Server-ID</span><span class="pop-val">#${p.id}</span></div>
    <div class="pop-row"><span class="pop-key">Position</span><span class="pop-val">${p.x.toFixed(0)}, ${p.y.toFixed(0)}</span></div>
    <div class="pop-row"><span class="pop-key">Höhe</span><span class="pop-val">${p.z.toFixed(1)}</span></div>
    ${p.inVeh ? `<div class="pop-row"><span class="pop-key">Fahrzeug</span><span class="pop-val">${p.veh || '?'}</span></div>` : ''}
    <div class="pop-actions">
      <button class="pop-btn pop-btn-blue" onclick="flyToPlayer(${id})">🎯 Anzeigen</button>
      <button class="pop-btn pop-btn-red" onclick="setFollow(${id})">${followPlayer === id ? '⛔ Unfollow' : '👁 Follow'}</button>
    </div>
  </div>`;
    }

    function flyToPlayer(id) {
      const p = allPlayers.find(x => x.id === id);
      if (!p) return;
      map.flyTo([p.y, p.x], 3, { animate: true, duration: 0.5 });
    }

    function setFollow(id) {
      followPlayer = (followPlayer === id) ? null : id;
      updateFollowBtn();
      renderLists();
      if (id && playerLayers[id]) playerLayers[id].closePopup();
    }

    function updateFollowBtn() {
      const btn = document.getElementById('followBtn');
      if (followPlayer) {
        const p = allPlayers.find(x => x.id === followPlayer);
        btn.textContent = '👁 Follow: ' + (p ? p.name : '#' + followPlayer);
        btn.className = 'btn btn-teal';
      } else {
        btn.textContent = '👁 Follow: AUS';
        btn.className = 'btn';
      }
    }

    function toggleFollow() {
      followPlayer = null;
      updateFollowBtn();
    }

    // ═══════════════════════════════════════════════════════════
    // MARKER AUF KARTE
    // ═══════════════════════════════════════════════════════════

    function updateMarkerLayers(markers) {
      const seen = new Set();

      markers.forEach(m => {
        seen.add(m.id);
        const col = m.color || gcolor(m.group);

        if (markerLayers[m.id]) {
          markerLayers[m.id].setLatLng([m.y, m.x]);
        } else {
          const lm = L.marker([m.y, m.x], { icon: makeMarkerIcon(col, m.icon) });
          lm.bindPopup(buildMarkerPopup(m), { maxWidth: 240 });
          lm.addTo(map);
          markerLayers[m.id] = lm;
        }
      });

      for (const id in markerLayers) {
        if (!seen.has(id)) {
          map.removeLayer(markerLayers[id]);
          delete markerLayers[id];
        }
      }
    }

    function buildMarkerPopup(m) {
      const col = m.color || gcolor(m.group);
      return `<div class="pop">
    <div class="pop-title">${m.label || m.id}</div>
    <div class="pop-row"><span class="pop-key">ID</span><span class="pop-val">${m.id}</span></div>
    <div class="pop-row"><span class="pop-key">Position</span><span class="pop-val">${(+m.x).toFixed(1)}, ${(+m.y).toFixed(1)}</span></div>
    <div class="pop-row"><span class="pop-key">Höhe</span><span class="pop-val">${(+m.z).toFixed(1)}</span></div>
    <div class="pop-row"><span class="pop-key">Gruppe</span><span class="pop-val">${m.group || '–'}</span></div>
    <div class="pop-row"><span class="pop-key">Quelle</span><span class="pop-val">${m.source || '–'}</span></div>
    <div class="pop-actions">
      <button class="pop-btn pop-btn-red" onclick="removeMarker('${m.id}')">🗑 Löschen</button>
    </div>
  </div>`;
    }

    async function removeMarker(id) {
      if (!confirm('Marker "' + id + '" löschen?')) return;
      await fetch(BASE + '/d4rk_livemap/markers/remove?id=' + encodeURIComponent(id)).catch(() => { });
      if (markerLayers[id]) { map.removeLayer(markerLayers[id]); delete markerLayers[id]; }
      allMarkers = allMarkers.filter(m => m.id !== id);
      renderLists();
      if (document.querySelector('.leaflet-popup')) map.closePopup();
    }

    // ═══════════════════════════════════════════════════════════
    // SIDEBAR RENDERING
    // ═══════════════════════════════════════════════════════════

    function switchTab(tab) {
      activeTab = tab;
      document.getElementById('tabPlayers').classList.toggle('active', tab === 'players');
      document.getElementById('tabMarkers').classList.toggle('active', tab === 'markers');
      activeGroup = null;
      renderLists();
    }

    function renderLists() {
      const search = (document.getElementById('search').value || '').toLowerCase();

      if (activeTab === 'players') {
        document.getElementById('groupFilter').style.display = 'none';
        const filtered = allPlayers.filter(p =>
          !search || p.name.toLowerCase().includes(search) || String(p.id).includes(search)
        );
        document.getElementById('tabContent').innerHTML = filtered.length
          ? filtered.map(p => {
            const col = getPlayerColor(p.id);
            const inVeh = p.inVeh ? `🚗 ${p.veh || 'Fahrzeug'}` : `🚶 Zu Fuß`;
            const isFlw = followPlayer === p.id;
            return `<div class="p-item ${isFlw ? '' : ''}">
            <div class="p-avatar" style="background:${col}22;border-color:${col};color:${col}">${p.id}</div>
            <div class="p-info">
              <div class="p-name">${p.name}</div>
              <div class="p-detail">${inVeh} · ${p.x.toFixed(0)}, ${p.y.toFixed(0)}</div>
            </div>
            <button class="m-del" title="${isFlw ? 'Unfollow' : 'Follow'}" onclick="setFollow(${p.id})">${isFlw ? '⛔' : '👁'}</button>
          </div>`;
          }).join('')
          : '<div class="list-empty">Keine Spieler online</div>';

      } else {
        // Gruppen-Filter aufbauen
        const groups = [...new Set(allMarkers.map(m => m.group || 'Sonstiges'))];
        const gf = document.getElementById('groupFilter');
        gf.style.display = groups.length > 1 ? 'flex' : 'none';
        gf.innerHTML = [{ label: 'Alle', active: !activeGroup }]
          .concat(groups.map(g => ({ label: g, active: activeGroup === g })))
          .map(g => `<button class="gf-btn ${g.active ? 'active' : ''}" onclick="setGroupFilter('${g.label}')">${g.label}</button>`)
          .join('');

        const filtered = allMarkers.filter(m => {
          if (activeGroup && (m.group || 'Sonstiges') !== activeGroup) return false;
          if (search && !(m.label || m.id).toLowerCase().includes(search)) return false;
          return true;
        });
        document.getElementById('tabContent').innerHTML = filtered.length
          ? filtered.map(m => {
            const col = m.color || gcolor(m.group);
            return `<div class="m-item" onclick="flyToMarker('${m.id}')">
            <div class="m-dot" style="background:${col}44;border-color:${col}"></div>
            <div class="m-info">
              <div class="m-name">${m.label || m.id}</div>
              <div class="m-meta">${(+m.x).toFixed(0)}, ${(+m.y).toFixed(0)} · ${m.group || '?'}</div>
            </div>
            <button class="m-del" onclick="event.stopPropagation();removeMarker('${m.id}')" title="Löschen">✕</button>
          </div>`;
          }).join('')
          : '<div class="list-empty">Keine Marker</div>';
      }
    }

    function setGroupFilter(g) {
      activeGroup = (g === 'Alle') ? null : g;
      renderLists();
    }

    function flyToMarker(id) {
      const m = allMarkers.find(x => x.id === id);
      if (!m) return;
      map.flyTo([m.y, m.x], 3, { animate: true, duration: 0.5 });
      setTimeout(() => { if (markerLayers[id]) markerLayers[id].openPopup(); }, 550);
    }

    // ═══════════════════════════════════════════════════════════
    // POLLING
    // ═══════════════════════════════════════════════════════════

    let pollOk = false;

    async function poll() {
      try {
        const r = await fetch(BASE + '/d4rk_livemap/data', { cache: 'no-store' });
        if (!r.ok) throw new Error('HTTP ' + r.status);
        const d = await r.json();

        allPlayers = d.players || [];
        allMarkers = d.markers || [];

        // Im Marker-Modus: Spieler ignorieren
        if (!MODE_MARKERS) {
          updatePlayerMarkers(allPlayers);
        }
        updateMarkerLayers(allMarkers);
        renderLists();

        // Stats
        document.getElementById('statPlayers').textContent = allPlayers.length;
        document.getElementById('statMarkers').textContent = allMarkers.length;

        const pill = document.getElementById('onlineCount');
        pill.textContent = allPlayers.length + ' Online';
        pill.className = 'pill pill-teal';

        const dot = document.getElementById('statusDot');
        dot.className = 'pulse';

        document.getElementById('updateStatus').textContent =
          'Update: ' + new Date().toLocaleTimeString('de-DE', { hour: '2-digit', minute: '2-digit', second: '2-digit' });

        pollOk = true;

        // Follow-Modus
        if (followPlayer) {
          const p = allPlayers.find(x => x.id === followPlayer);
          if (p) map.panTo([p.y, p.x], { animate: true, duration: 0.4 });
        }
      } catch (e) {
        if (pollOk) {
          document.getElementById('statusDot').className = 'pulse dead';
          document.getElementById('onlineCount').className = 'pill pill-red';
          document.getElementById('onlineCount').textContent = 'Offline';
          document.getElementById('updateStatus').textContent = 'Verbindung verloren';
          pollOk = false;
        }
      }
    }

    // ═══════════════════════════════════════════════════════════
    // UI HELPER
    // ═══════════════════════════════════════════════════════════

    function centerMap() {
      map.flyToBounds(GTA_BOUNDS, { animate: true, duration: 0.8, padding: [20, 20] });
    }

    function toggleSidebar() {
      document.getElementById('sidebar').classList.toggle('hidden');
      setTimeout(() => map.invalidateSize(), 300);
    }

    // Koordinaten-Anzeige
    map.on('mousemove', e => {
      document.getElementById('coords').textContent =
        `X: ${e.latlng.lng.toFixed(1)} · Y: ${e.latlng.lat.toFixed(1)}`;
    });

    // ═══════════════════════════════════════════════════════════
    // START
    // ═══════════════════════════════════════════════════════════

    // URL-Parameter anwenden
    if (MODE_MARKERS) {
      // Spieler-Tab verstecken, direkt auf Marker-Tab schalten
      const tabPlayers = document.getElementById('tabPlayers');
      if (tabPlayers) tabPlayers.style.display = 'none';
      switchTab('markers');
    }

    if (PRESET_GROUP) {
      // Bestimmte Gruppe vorfiltern (z.B. ?group=Props)
      activeGroup = PRESET_GROUP;
    }

    if (HIDE_SIDEBAR) {
      // Sidebar direkt ausblenden
      const sb = document.getElementById('sidebar');
      if (sb) sb.classList.add('hidden');
      setTimeout(() => map.invalidateSize(), 100);
    }

    poll();
    setInterval(poll, POLL_INTERVAL);
  </script>
</body>

</html>
